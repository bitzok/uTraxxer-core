spring.application.name=core
server.servlet.context-path=/api/v1
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=${DB_SHOW_SQL}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

resilience4j.ratelimiter.instances.auth-limit.limit-for-period=5
resilience4j.ratelimiter.instances.auth-limit.limit-refresh-period=1m
resilience4j.ratelimiter.instances.auth-limit.timeout-duration=0s